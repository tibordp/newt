# Linux packaging legs for the Package workflow, x86_64 and an arm64
# mirror. No Arch arm64 leg: Arch Linux ARM is a separate port and the
# archlinux container image is x86_64-only.
#
# Per-leg fields: `runtime_deps` feeds the .deb Depends: line (t64
# naming varies by release), `deb_arch`/`appimage_arch` feed
# build-deb.sh / build-appimage.sh, `distro` keys artifact names and
# caches. Install-time deps are derived from pkg_type in the workflow.
# The AppImage legs build their own binary (agents found relative to it,
# elevation through a staged agent copy), on Ubuntu 22.04: the oldest
# glibc in the matrix.

# ─── x86_64 ───

- name: Debian 12
  runner: ubuntu-latest
  container: debian:12
  distro: debian12
  pkg_type: deb
  runtime_deps: "libwebkit2gtk-4.1-0, libgtk-3-0"

- name: Debian 13
  runner: ubuntu-latest
  container: debian:13
  distro: debian13
  pkg_type: deb
  runtime_deps: "libwebkit2gtk-4.1-0, libgtk-3-0t64"

- name: Ubuntu 22.04
  runner: ubuntu-latest
  container: ubuntu:22.04
  distro: ubuntu2204
  pkg_type: deb
  runtime_deps: "libwebkit2gtk-4.1-0, libgtk-3-0"

- name: Ubuntu 24.04
  runner: ubuntu-latest
  container: ubuntu:24.04
  distro: ubuntu2404
  pkg_type: deb
  runtime_deps: "libwebkit2gtk-4.1-0, libgtk-3-0t64"

- name: Ubuntu 26.04
  runner: ubuntu-latest
  container: ubuntu:26.04
  distro: ubuntu2604
  pkg_type: deb
  runtime_deps: "libwebkit2gtk-4.1-0, libgtk-3-0t64"

- name: Fedora 43
  runner: ubuntu-latest
  container: fedora:43
  distro: fedora43
  pkg_type: rpm

- name: Fedora 44
  runner: ubuntu-latest
  container: fedora:44
  distro: fedora44
  pkg_type: rpm

- name: Arch Linux
  runner: ubuntu-latest
  container: archlinux:latest
  distro: arch
  pkg_type: arch

- name: AppImage (x86_64)
  runner: ubuntu-latest
  container: ubuntu:22.04
  distro: appimage-x86_64
  pkg_type: appimage
  appimage_arch: x86_64

# ─── arm64 ───

- name: Debian 12 (arm64)
  runner: ubuntu-24.04-arm
  container: debian:12
  distro: debian12-arm64
  pkg_type: deb
  deb_arch: arm64
  runtime_deps: "libwebkit2gtk-4.1-0, libgtk-3-0"

- name: Debian 13 (arm64)
  runner: ubuntu-24.04-arm
  container: debian:13
  distro: debian13-arm64
  pkg_type: deb
  deb_arch: arm64
  runtime_deps: "libwebkit2gtk-4.1-0, libgtk-3-0t64"

- name: Ubuntu 22.04 (arm64)
  runner: ubuntu-24.04-arm
  container: ubuntu:22.04
  distro: ubuntu2204-arm64
  pkg_type: deb
  deb_arch: arm64
  runtime_deps: "libwebkit2gtk-4.1-0, libgtk-3-0"

- name: Ubuntu 24.04 (arm64)
  runner: ubuntu-24.04-arm
  container: ubuntu:24.04
  distro: ubuntu2404-arm64
  pkg_type: deb
  deb_arch: arm64
  runtime_deps: "libwebkit2gtk-4.1-0, libgtk-3-0t64"

- name: Ubuntu 26.04 (arm64)
  runner: ubuntu-24.04-arm
  container: ubuntu:26.04
  distro: ubuntu2604-arm64
  pkg_type: deb
  deb_arch: arm64
  runtime_deps: "libwebkit2gtk-4.1-0, libgtk-3-0t64"

- name: Fedora 43 (arm64)
  runner: ubuntu-24.04-arm
  container: fedora:43
  distro: fedora43-arm64
  pkg_type: rpm

- name: Fedora 44 (arm64)
  runner: ubuntu-24.04-arm
  container: fedora:44
  distro: fedora44-arm64
  pkg_type: rpm

- name: AppImage (aarch64)
  runner: ubuntu-24.04-arm
  container: ubuntu:22.04
  distro: appimage-aarch64
  pkg_type: appimage
  appimage_arch: aarch64
