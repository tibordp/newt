name: Package

# Packages each push to main once the Build workflow has passed on it.
# A workflow_run workflow runs in the default branch's context, where
# `github.sha` is whatever main's tip is by then: everything here checks
# out and labels COMMIT, the commit Build passed on.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # ─── Stage 0: Build matrices ───
  #
  # Every distro release, x86_64 and arm64 (Linux legs live in
  # .github/package-matrix.yml), both macOS and both Windows arches.

  plan:
    name: Plan
    runs-on: ubuntu-latest
    # Build also runs for pull requests, whose head branch may be a fork's
    # `main`: only a passing push qualifies.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT }}
      # macOS signing and notarization are all or nothing: with only part of
      # the secrets Tauri signs but skips notarization with a mere warning,
      # and Gatekeeper then blocks the app. Upstream requires all of them; a
      # fork without any builds unsigned.
      - id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8"
          missing=""
          for name in $names; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$missing" = " $names" ] && [ "$GITHUB_REPOSITORY" != "tibordp/newt" ]; then
            echo "::warning::No Apple signing secrets — building unsigned macOS artifacts."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing Apple signing secrets:$missing"
            exit 1
          fi
      - id: plan
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, yaml

          linux = yaml.safe_load(open(".github/package-matrix.yml"))
          macos = [
              {"arch": "aarch64", "target": "aarch64-apple-darwin"},
              {"arch": "x86_64", "target": "x86_64-apple-darwin"},
          ]
          windows = [
              {"arch": "x86_64", "target": "x86_64-pc-windows-msvc", "msi_arch": "x64"},
              {"arch": "aarch64", "target": "aarch64-pc-windows-msvc", "msi_arch": "arm64"},
          ]

          for key, legs in {"linux": linux, "macos": macos, "windows": windows}.items():
              print(f"{key}={json.dumps(legs)}")
          EOF
  # ─── Stage 1: Build agent binaries ───

  agent:
    name: Agent (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: plan
    # One shared target dir (cargo's default location) so
    # Swatinem/rust-cache actually caches the agent build. Each job
    # builds a single triple and nothing else, so xtask's per-triple
    # split (local default) buys nothing here. Set job-wide so the
    # rust-cache step sees it too.
    env:
      CARGO_TARGET_DIR: target
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-${{ matrix.target }}
      # Linux-musl targets cross-compile via cargo-zigbuild. Zig 0.16
      # ships a broken `ar` that fails to create archives for C -sys
      # crates (aws-lc-sys, bzip2-sys, etc.) — stay on 0.15 until
      # cargo-zigbuild supports the newer llvm-ar behavior.
      - name: Install zig
        if: contains(matrix.target, 'linux-musl')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      # cargo-zigbuild >= 0.23 is required: rustc >= 1.98 passes
      # `--fix-cortex-a53-843419` for aarch64 musl, which zig rejects
      # unless cargo-zigbuild filters it out.
      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'linux-musl')
        run: cargo install cargo-zigbuild --version 0.23.3 --locked
      - name: Build agent
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cargo xtask agents ${{ matrix.target }}
      # Sign the darwin agents at the build stage, not in the macOS package
      # job: the darwin agents are bundled into *every* platform's package
      # (remoting into a Mac uploads and runs them there, where Gatekeeper
      # wants a valid signature), so signing here means all platforms ship the
      # identical signed binary. It also has to happen here — Tauri seals but
      # never signs these nested Resources/ executables, so the .app build is
      # too late. Sign after the strip so it's the last mutation of the bytes.
      - name: Sign agent (macOS)
        if: contains(matrix.target, 'apple-darwin')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE not set — shipping an unsigned agent."
            exit 0
          fi
          packaging/macos/import-signing-cert.sh
          AGENT="agents/${{ matrix.target }}/newt-agent"
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" "$AGENT"
          codesign --verify --strict --verbose=2 "$AGENT"
          # Refresh the informational sidecar to match the signed bytes.
          # (Runtime agent integrity uses a live blake3 of the executed bytes,
          # not this file — but keep it truthful.)
          shasum -a 256 "$AGENT" > "$AGENT.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: agent-${{ matrix.target }}
          path: agents/${{ matrix.target }}/
          retention-days: 7
          if-no-files-found: error

  # ─── Stage 2: Build frontend once ───

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: plan
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ─── Stage 3: Per-distro build + package ───

  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    needs: [plan, agent, frontend]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux) }}

    steps:
      - name: Install system dependencies
        run: |
          case "${{ matrix.pkg_type }}" in
            deb|appimage)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y curl build-essential pkg-config git python3 \
                libwebkit2gtk-4.1-dev librsvg2-dev
              ;;
            rpm)
              dnf install -y gcc g++ make pkg-config git python3 \
                webkit2gtk4.1-devel gtk3-devel librsvg2-devel rpm-build
              ;;
            arch)
              pacman -Syu --noconfirm
              pacman -S --noconfirm base-devel pkgconf git python \
                webkit2gtk-4.1 gtk3 librsvg libarchive
              ;;
          esac

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT }}

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.distro }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.distro }}-

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist/

      - name: Download agent artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: agent-*
          path: agents/
          merge-multiple: false

      - name: Arrange agent artifacts
        run: |
          cd agents
          for dir in agent-*/; do
            triple="${dir#agent-}"
            triple="${triple%/}"
            mkdir -p "$triple"
            cp -r "$dir"* "$triple/"
            rm -rf "$dir"
          done
          chmod +x */newt-agent

      # The AppImage runs from wherever it is mounted, so it finds agents
      # relative to its binary; the native packages install to /usr.
      - name: Build binary
        env:
          NEWT_SYSTEM_AGENT_DIR: ${{ matrix.pkg_type == 'appimage' && '../share/newt/agents' || '/usr/share/newt/agents' }}
          FEATURES: ${{ matrix.pkg_type == 'appimage' && 'custom-protocol,elevate-agent-copy' || 'custom-protocol' }}
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          . "$HOME/.cargo/env"
          cargo build --release -p newt --features "$FEATURES"

      - name: Build .deb
        if: matrix.pkg_type == 'deb'
        env:
          VERSION: ${{ needs.frontend.outputs.version }}
          DEPS: ${{ matrix.runtime_deps }}
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.deb_arch || 'amd64' }}
        run: packaging/debian/build-deb.sh

      - name: Build .rpm
        if: matrix.pkg_type == 'rpm'
        env:
          VERSION: ${{ needs.frontend.outputs.version }}
        run: |
          rpmbuild -bb packaging/rpm/newt.spec \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "_newt_srcdir $(pwd)" \
            --define "_newt_version $VERSION" \
            --define "_newt_binary $(pwd)/target/release/newt" \
            --define "_newt_agent_dir $(pwd)/agents"
          cp "rpmbuild/RPMS/$(uname -m)"/*.rpm .

      - name: Build .pkg.tar.zst
        if: matrix.pkg_type == 'arch'
        env:
          VERSION: ${{ needs.frontend.outputs.version }}
        run: packaging/arch/build-pkg.sh

      # Slim try-it-out artifact: no bundled libraries (needs system
      # WebKitGTK 4.1 — same runtime deps as the native packages).
      # Deliberately not `cargo tauri build --bundles appimage`: tauri's
      # bundler forces GDK_BACKEND=x11 / GTK_THEME and its exports leak
      # into shells spawned from Newt's terminal.
      - name: Build AppImage
        if: matrix.pkg_type == 'appimage'
        env:
          VERSION: ${{ needs.frontend.outputs.version }}
          ARCH: ${{ matrix.appimage_arch }}
          # The container has no FUSE; run appimagetool extracted.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          apt-get install -y file
          curl -fsSL --retry 3 -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${ARCH}.AppImage"
          chmod +x /usr/local/bin/appimagetool
          packaging/appimage/build-appimage.sh

      - uses: actions/upload-artifact@v6
        if: matrix.pkg_type == 'appimage'
        with:
          name: package-appimage-${{ matrix.appimage_arch }}
          path: "*.AppImage"
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: matrix.pkg_type != 'appimage'
        with:
          name: package-${{ matrix.distro }}
          path: |
            *.deb
            *.rpm
            *.pkg.tar.zst
          retention-days: 7
          if-no-files-found: error

  # ─── Stage 3b: macOS .dmg ───

  # Both legs build on the arm runner; the x86_64 leg
  # cross-compiles, so --target is always explicit.
  package-macos:
    name: Package (macOS ${{ matrix.arch }})
    runs-on: macos-latest
    needs: [plan, agent, frontend]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.macos) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-macos-${{ matrix.arch }}
      # Prebuilt from the tauri-cli release — compiling it via
      # `cargo install` costs minutes per cache miss.
      - name: Install tauri-cli
        run: |
          curl -fsSL --retry 3 -o cargo-tauri.zip \
            https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-aarch64-apple-darwin.zip
          tar -xf cargo-tauri.zip -C "$HOME/.cargo/bin" cargo-tauri
          chmod +x "$HOME/.cargo/bin/cargo-tauri"
          rm cargo-tauri.zip
          cargo tauri --version
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist/
      - name: Download agent artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: agent-*
          path: agents/
          merge-multiple: false
      - name: Arrange agent artifacts
        run: |
          cd agents
          for dir in agent-*/; do
            triple="${dir#agent-}"
            triple="${triple%/}"
            mkdir -p "$triple"
            cp -r "$dir"* "$triple/"
            rm -rf "$dir"
          done
          chmod +x */newt-agent
      # Import the identity for signing the .app and stage the App Store
      # Connect API key that Tauri's notarytool call reads via
      # APPLE_API_KEY_PATH. The bundled agents are already signed (agent
      # stage); Tauri seals them into the .app it signs and notarizes. No-op
      # (unsigned .dmg) when the secret is absent, e.g. on a fork run.
      - name: Set up code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          packaging/macos/import-signing-cert.sh
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          fi
      # With the identity already in our keychain, Tauri needs only the
      # identity name plus the notarization creds — deliberately NOT
      # APPLE_CERTIFICATE (see import-signing-cert.sh). All empty on forks →
      # unsigned build.
      - name: Build Tauri app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: >
          cargo tauri build
          --target ${{ matrix.target }}
          --bundles dmg
          --config '{"build":{"beforeBuildCommand":""}}'
      # Check the artifact as a user's Mac will: Gatekeeper must accept the
      # app as notarized with the ticket stapled (the DMG itself is signed,
      # not notarized; Gatekeeper assesses the app inside), and the agents
      # sealed into it must still carry their signatures.
      - name: Verify signature and notarization
        if: needs.plan.outputs.signed == 'true'
        run: |
          DMG=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          codesign --verify --strict --verbose=2 "$DMG"
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          trap 'hdiutil detach "$MNT"' EXIT
          APP=$(ls -d "$MNT"/*.app)
          codesign --verify --deep --strict --verbose=2 "$APP"
          for agent in "$APP"/Contents/Resources/agents/*-apple-darwin/newt-agent; do
            codesign --verify --strict --verbose=2 "$agent"
          done
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 | tee spctl.log
          grep -q "source=Notarized Developer ID" spctl.log
          xcrun stapler validate "$APP"
      - uses: actions/upload-artifact@v6
        with:
          name: package-macos-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          retention-days: 7
          if-no-files-found: error

  # ─── Stage 3c: Windows .msi ───
  #
  # Both arches cross-compile on the x86_64 `windows-latest` runner (the
  # MSVC toolchain there carries the ARM64 cross tools), mirroring the
  # Linux x86-runner pattern. The app is built with plain cargo and
  # packaged by packaging/windows/build-msi.ps1 (WiX, pinned in
  # .config/dotnet-tools.json) — Tauri's bundler is not used, same as on
  # Linux. The stage-1 Linux/macOS agents are bundled as on every other
  # platform — you remote *from* Windows into those. The one thing
  # Windows-specific: there is no remoting *into* Windows from another
  # platform (or another Windows arch), so the Windows agent is only ever
  # shipped here, and only for the build's own arch. It is built inline
  # for the build triple alongside the cross agents.

  package-windows:
    name: Package (Windows ${{ matrix.arch }})
    runs-on: windows-latest
    needs: [plan, agent, frontend]
    # Shared target dir so the inline agent build and the app build reuse
    # deps and are both covered by rust-cache (xtask honours this instead
    # of its local per-triple split).
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-windows-${{ matrix.arch }}
      # aws-lc-sys / ring assemble with NASM on Windows MSVC targets.
      - name: Install NASM
        run: choco install nasm --no-progress -y
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist/
      - name: Download agent artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: agent-*
          path: agents/
          merge-multiple: false
      - name: Arrange agent artifacts
        shell: bash
        run: |
          cd agents
          for dir in agent-*/; do
            triple="${dir#agent-}"
            triple="${triple%/}"
            mkdir -p "$triple"
            cp -r "$dir"* "$triple/"
            rm -rf "$dir"
          done
          chmod +x */newt-agent
      # Add this build's own-arch Windows agent next to the cross agents.
      # The Windows agent ships only on Windows, same-arch only.
      - name: Build agent (${{ matrix.target }})
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cargo xtask agents ${{ matrix.target }}
      - name: Build app
        run: cargo build --release --target ${{ matrix.target }} -p newt --features custom-protocol
      - name: Build .msi
        run: >
          packaging/windows/build-msi.ps1
          -Exe target/${{ matrix.target }}/release/newt.exe
          -AgentsDir agents
          -Version ${{ needs.frontend.outputs.version }}
          -Arch ${{ matrix.msi_arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: package-windows-${{ matrix.arch }}
          path: "*.msi"
          retention-days: 7
          if-no-files-found: error

  # ─── Stage 4: Publish immutable packages, then replace latest.json ───

  publish:
    name: Publish snapshot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [package, package-macos, package-windows, frontend]
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-west-1
      AWS_ROLE_ARN: ${{ secrets.NEWT_AWS_ROLE_ARN }}
      S3_BUCKET: ${{ secrets.NEWT_S3_BUCKET }}
      ARTIFACT_PREFIX: ${{ github.event.workflow_run.head_sha || github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT }}

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: package-artifacts
          merge-multiple: false

      - name: Build download manifest
        run: >-
          python3 packaging/publish/build-manifest.py
          --artifacts-dir package-artifacts
          --output-dir publish
          --artifact-prefix "$ARTIFACT_PREFIX"
          --commit "$COMMIT"
          --version "${{ needs.frontend.outputs.version }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: newt-package-${{ github.run_id }}

      - name: Upload immutable packages
        run: >-
          aws s3 cp publish/artifacts/
          "s3://$S3_BUCKET/downloads/artifacts/$ARTIFACT_PREFIX/"
          --recursive
          --only-show-errors
          --cache-control "public,max-age=31536000,immutable"
          --content-disposition attachment

      # Publish the manifest only after every package and checksum is present.
      - name: Publish latest manifest
        run: >-
          aws s3 cp publish/latest.json
          "s3://$S3_BUCKET/downloads/latest.json"
          --only-show-errors
          --cache-control "no-store"
          --content-type "application/json"
