[package]
name = "newt-rpc"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The binary RPC protocol between a Newt host and its agents"

[dependencies]
newt-common = { path = "../newt-common" }
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"
log = "0.4"
bytes = "1"
byteorder = "1.5"
futures = "0.3"
bincode = "1.3.3"
