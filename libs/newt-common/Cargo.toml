[package]
name = "newt-common"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Foundational types shared by every Newt crate: errors and platform-independent paths"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
specta = { version = "=2.0.0-rc.22", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31" }
