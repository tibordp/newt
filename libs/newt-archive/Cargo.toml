[package]
name = "newt-archive"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Sans-IO archive machinery for Newt: streaming tar/zip writers and a random-access zip reader"

[dependencies]
flate2 = "1"
xz2 = "0.1"
lzma-sys = "0.1"
zstd = "0.14"
bzip2 = "0.6"
deflate64 = "0.1"
crc32fast = "1"
aes = "0.9"
hmac = "0.13"
sha1 = "0.11"
pbkdf2 = "0.13"
getrandom = { version = "0.4", features = ["std"] }
iluvatar = { version = "0.5", default-features = false, features = ["gzip", "bz2", "xz", "zstandard", "aes"] }
sha2 = "0.11"

[dev-dependencies]
tar = "0.4"
zip = "8"
