[package]
name = "newt-archive"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Sans-IO archive machinery for Newt: streaming tar/zip writers and a random-access zip reader"

[dependencies]
flate2 = "1"
xz2 = "0.1"
zstd = "0.13"
bzip2 = "0.5"
deflate64 = "0.1"
crc32fast = "1"
aes = "0.8"
hmac = "0.12"
sha1 = "0.10"
pbkdf2 = "0.12"
getrandom = { version = "0.3", features = ["std"] }
iluvatar = { version = "0.4", default-features = false, features = ["gzip", "bz2", "xz", "zstandard", "aes"] }
sha2 = "0.10"

[dev-dependencies]
tar = "0.4"
zip = "2"
